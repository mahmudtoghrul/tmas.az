server {
    listen 80;
    server_name tmas.az www.tmas.az;
    return 301 https://tmas.az$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.tmas.az;

    ssl_certificate /etc/letsencrypt/live/tmas.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tmas.az/privkey.pem;

    return 301 https://tmas.az$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tmas.az;

    ssl_certificate /etc/letsencrypt/live/tmas.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tmas.az/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/tmas.az/public;
    index index.php;
    charset utf-8;

    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Static files caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Block access to hidden files and sensitive dirs
    location ~ /\. { deny all; }
    location ~ ^/(config|core|app|storage|migrations|lang|admin|vendor) { deny all; }

    # Allow admin panel
    location ^~ /admin {
        try_files $uri /index.php?$query_string;
    }

    # Main routing — all requests go through index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Uploads
    location /uploads {
        alias /var/www/tmas.az/public/uploads;
        expires 7d;
    }

    access_log /var/log/nginx/tmas.az.access.log;
    error_log /var/log/nginx/tmas.az.error.log;
}
